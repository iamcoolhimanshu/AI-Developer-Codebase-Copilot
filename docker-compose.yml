services:
  mysql:
    image: mysql:8.4
    container_name: codecopilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-codecopilot}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: codecopilot-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/${DB_NAME:-codecopilot}?createDatabaseIfNotExist=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-grok-4}
      XAI_BASE_URL: ${XAI_BASE_URL:-https://api.x.ai/v1}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      APP_STORAGE_ROOT: /data/repos
    ports:
      - "8080:8080"
    volumes:
      - repo_data:/data/repos

  frontend:
    build:
      context: ./frontend
    container_name: codecopilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "1234:80"

volumes:
  mysql_data:
  repo_data: