spring.application.name=codebase-copilot

# --- mysql profile ---

spring.config.activate.on-profile=mysql
spring.datasource.url=jdbc:mysql://localhost:3306/codecopilot?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=HIMANSHU
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never

spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:220MB}

# Faithful use: Grok (xAI) exposes an OpenAI-compatible API.
spring.ai.openai.base-url=${XAI_BASE_URL:https://api.x.ai/v1}
# Placeholder keeps the OpenAI autoconfig happy at startup; real key via XAI_API_KEY.
spring.ai.openai.api-key=${XAI_API_KEY:local-noop-key-not-for-production}
spring.ai.openai.chat.options.model=${XAI_MODEL:grok-4}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=${XAI_EMBEDDING_MODEL:text-embedding-v3}
spring.ai.chat.enabled=true

server.port=${SERVER_PORT:8080}
server.error.include-message=always

# Root folder where cloned repositories / uploads are kept (outside of any jar).
app.storage.root=${APP_STORAGE_ROOT:./data/repos}
app.indexing.max-files-per-repo=${MAX_FILES_PER_REPO:20000}
app.indexing.max-repo-size-bytes=${MAX_REPO_SIZE_BYTES:500000000}
app.indexing.embedding-dimension=${EMBEDDING_DIMENSION:1024}
app.indexing.chunk.max-chars=1500
app.indexing.chunk.overlap=120
app.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.refresh-expiration-ms=${REFRESH_EXPIRATION_MS:2592000000}
app.github.token=${GITHUB_TOKEN:}
app.ai.api-key=${XAI_API_KEY:}
app.ai.max-agent-tool-calls=${MAX_AGENT_TOOL_CALLS:12}
app.ai.max-context-chunks=${MAX_CONTEXT_CHUNKS:14}
app.ai.require-key=${AI_REQUIRE_KEY:false}

management.endpoints.web.exposure.include=health,info,metrics

logging.level.com.codecopilot=INFO
logging.level.org.hibernate=WARN

