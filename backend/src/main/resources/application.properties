spring.application.name=codebase-copilot
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:200MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:220MB}

# --- AI provider (OpenAI-compatible) ---
# Works with BOTH providers. Priority: OPENAI_* > XAI_* . Generic AI_* also supported via app.ai.api-key.
# Grok:  XAI_API_KEY=xai-...  XAI_MODEL=grok-4
# OpenAI: OPENAI_API_KEY=sk-...  OPENAI_MODEL=gpt-4o-mini
spring.ai.openai.base-url=${OPENAI_BASE_URL:${XAI_BASE_URL:https://api.x.ai/v1}}
spring.ai.openai.api-key=${OPENAI_API_KEY:${XAI_API_KEY:local-noop-key-not-for-production}}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:${XAI_MODEL:grok-4}}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:${XAI_EMBEDDING_MODEL:text-embedding-3-small}}
spring.ai.chat.enabled=true

server.port=${SERVER_PORT:8080}
server.error.include-message=always

app.storage.root=${APP_STORAGE_ROOT:./data/repos}
app.indexing.max-files-per-repo=${MAX_FILES_PER_REPO:20000}
app.indexing.max-repo-size-bytes=${MAX_REPO_SIZE_BYTES:500000000}
app.indexing.embedding-dimension=${EMBEDDING_DIMENSION:1024}
app.indexing.chunk.max-chars=1500
app.indexing.chunk.overlap=120
app.security.jwt-secret=${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789abcdef}
app.security.jwt-expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.refresh-expiration-ms=${REFRESH_EXPIRATION_MS:2592000000}
app.github.token=${GITHUB_TOKEN:}
app.ai.api-key=${OPENAI_API_KEY:${XAI_API_KEY:}}
app.ai.max-agent-tool-calls=${MAX_AGENT_TOOL_CALLS:12}
app.ai.max-context-chunks=${MAX_CONTEXT_CHUNKS:14}
app.ai.require-key=${AI_REQUIRE_KEY:false}

management.endpoints.web.exposure.include=health,info,metrics

logging.level.com.codecopilot=INFO
logging.level.org.hibernate=WARN

# --- dev profile (default; in-memory H2) ---
spring.config.activate.on-profile=dev
spring.datasource.url=jdbc:h2:mem:copilot;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=never

# --- mysql profile ---
spring.config.activate.on-profile=mysql
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/codecopilot?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:HIMANSHU}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.sql.init.mode=never
